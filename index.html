<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🚗Antera Motorsports - Price Calculator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- Main App -->
  <main class="app">

    <!-- Header -->
    <header class="header">

      <div class="header-badge">
        Ascend Roleplay
      </div>

      <h1 class="header-title">
        Antera Motorsports
      </h1>

      <p class="header-subtitle">
        PREMIUM PRICE CALCULATOR
      </p>

    </header>

    <!-- Calculator -->
    <section class="calculator-card">

      <div class="section-divider">
        <span>SERVICES</span>
      </div>

      <div id="servicesList" class="services-section"></div>

      <!-- Total -->
      <section class="total-section">

        <div class="total-label">
          TOTAL ESTIMATE
        </div>

        <div class="total-amount" id="totalAmount">
          $0
        </div>

        <div class="total-subtext" id="totalSubtext">
          No services selected
        </div>

      </section>

      <!-- Buttons -->
      <div class="actions">

        <button class="btn btn-reset" id="resetBtn">
          Reset
        </button>

        <button class="btn btn-copy" id="copyBtn">
          Copy Summary
        </button>

      </div>

      <!-- Toast -->
      <div class="toast" id="toast">
        Copied to clipboard!
      </div>

    </section>

    <footer class="footer">Scott Payaluga &mdash; Kaula Lampur &copy; 2026</footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
